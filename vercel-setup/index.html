<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traverse Studio — Prototypes</title>
  <link rel="stylesheet" href="../design-system/colors_and_type.css" />
  <link rel="icon" type="image/png" href="../assets/logos/studio_square_light.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--surface-900);
      background: var(--surface-50);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .shell { max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; }

    header.brand {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 40px;
    }
    header.brand img.wordmark { height: 26px; display: block; }
    header.brand .badge {
      font: 600 11px/1 var(--font-sans);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--surface-600);
      border: 1px solid var(--surface-200);
      background: #fff;
      border-radius: 9999px;
      padding: 6px 10px;
    }

    h1 {
      font: 600 28px/1.2 var(--font-sans);
      letter-spacing: -0.01em;
      color: var(--surface-900);
      margin: 0 0 8px;
    }
    p.lede {
      font: 400 15px/1.55 var(--font-sans);
      color: var(--surface-600);
      margin: 0 0 32px;
      max-width: 56ch;
    }

    .list { display: flex; flex-direction: column; gap: 12px; }

    a.row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      background: #fff;
      border: 1px solid var(--surface-200);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      transition: box-shadow 200ms var(--ease-std), border-color 200ms var(--ease-std);
    }
    a.row:hover {
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border-color: var(--surface-300);
    }
    a.row .row-text { min-width: 0; }
    a.row .row-title {
      font: 600 15px/1.3 var(--font-sans);
      color: var(--surface-900);
      margin: 0 0 4px;
    }
    a.row .row-desc {
      font: 400 13px/1.5 var(--font-sans);
      color: var(--surface-500);
      margin: 0;
    }
    a.row .row-arrow {
      flex: none;
      width: 32px; height: 32px;
      border-radius: 9999px;
      background: var(--surface-50);
      border: 1px solid var(--surface-200);
      color: var(--surface-600);
      display: inline-flex; align-items: center; justify-content: center;
      font: 500 14px/1 var(--font-sans);
      transition: background 200ms var(--ease-std), color 200ms var(--ease-std), border-color 200ms var(--ease-std);
    }
    a.row:hover .row-arrow {
      background: var(--primary-600);
      border-color: var(--primary-500);
      color: #fff;
    }

    footer.foot {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--surface-200);
      font: 400 12px/1.4 var(--font-sans);
      color: var(--surface-500);
      display: flex; justify-content: space-between; align-items: center;
    }
    footer.foot a { color: var(--surface-600); text-decoration: none; }
    footer.foot a:hover { color: var(--primary-700); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <img class="wordmark" src="../assets/logos/studio_full_light.svg" alt="Traverse Studio" />
      <span class="badge">Prototypes</span>
    </header>

    <h1>Prototypes</h1>
    <p class="lede">Static prototypes for in-progress features. Pick one to open it.</p>

    <div class="list">
      <a class="row" href="/dashboard">
        <div class="row-text">
          <h2 class="row-title">Dashboard</h2>
          <p class="row-desc">Workspace dashboard, settings, org admin, user profile, invites.</p>
        </div>
        <span class="row-arrow" aria-hidden="true">→</span>
      </a>
      <a class="row" href="/user-onboarding">
        <div class="row-text">
          <h2 class="row-title">User onboarding</h2>
          <p class="row-desc">Signup, OAuth, post-signup workspace landing.</p>
        </div>
        <span class="row-arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <footer class="foot">
      <span>Traverse Studio</span>
      <a href="../design-system/traverse-studio-design-system.html">Design system →</a>
    </footer>
  </div>
</body>
</html>
