<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.av{border-radius:9999px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#64748b;overflow:hidden;font-weight:600}
.lab{font:500 10px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:#64748b;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
.stack{display:flex}
.stack .av{border:2px solid #fff;margin-left:-8px}
.stack .av:first-child{margin-left:0}
</style></head><body>
<div class="g">
  <div class="col"><div class="av" style="width:24px;height:24px;font-size:10px"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg></div><div class="lab">xs 24</div></div>
  <div class="col"><div class="av" style="width:32px;height:32px;font-size:12px;background:#4f46e5;color:#fff">JD</div><div class="lab">md 32</div></div>
  <div class="col"><div class="av" style="width:40px;height:40px;font-size:14px;background:#db2777;color:#fff">LC</div><div class="lab">lg 40</div></div>
  <div class="col"><div class="av" style="width:48px;height:48px;font-size:18px;background:#16a34a;color:#fff">MJ</div><div class="lab">xl 48</div></div>
  <div class="col"><div class="stack"><div class="av" style="width:32px;height:32px;background:#4f46e5;color:#fff;font-size:11px">A</div><div class="av" style="width:32px;height:32px;background:#db2777;color:#fff;font-size:11px">B</div><div class="av" style="width:32px;height:32px;background:#0d9488;color:#fff;font-size:11px">C</div><div class="av" style="width:32px;height:32px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:600">+3</div></div><div class="lab">stack</div></div>
</div>
</body></html>
