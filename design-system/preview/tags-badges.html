<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:5px 10px;font:500 11px/1 Inter}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:6px;font:600 10px/1 Inter;letter-spacing:.05em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 Inter;color:#334155}
.status .dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0}
</style></head><body>
<div class="row">
  <span class="tag" style="color:#4f46e5;background:#4f46e50D">Primary</span>
  <span class="tag" style="color:#16a34a;background:#16a34a0D">Active</span>
  <span class="tag" style="color:#D92D20;background:#D92D200D">Archived</span>
  <span class="tag" style="color:#0284c7;background:#0284c70D">Beta</span>
  <span class="tag" style="color:#db2777;background:#db27770D">Priority</span>
  <span class="tag" style="color:#374151;background:#3741510D">Default</span>
</div>
<div class="row">
  <span class="badge" style="background:#f1f5f9;color:#cbd5e1">COMING</span>
  <span class="badge" style="background:#f1f5f9;color:#cbd5e1">DEMO</span>
  <span class="badge" style="background:#dcfce7;color:#039855">PUBLISHED</span>
  <span class="badge" style="background:#fef3c7;color:#cc8925">DRAFT</span>
  <span class="badge" style="background:#fee2e2;color:#D92D20">ARCHIVED</span>
</div>
<div class="row" style="gap:16px">
  <div class="status"><span class="dot" style="background:#16a34a"></span>Published</div>
  <div class="status"><span class="dot" style="background:#cc8925"></span>Draft</div>
  <div class="status"><span class="dot" style="background:#64748b"></span>Archived</div>
  <div class="status"><span class="dot" style="background:#4f46e5"></span>In review</div>
</div>
</body></html>
