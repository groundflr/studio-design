<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toast{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:12px 14px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)}
.t-def{background:#fff;border:1px solid #e2e8f0}
.t-err{background:#fff;border:1px solid #fecaca}
.t-suc{background:#fff;border:1px solid #bbf7d0}
.t-off{background:#0f172a;color:#fff}
.icn{width:20px;height:20px;flex-shrink:0}
.icn.e{color:#D92D20}.icn.s{color:#039855}.icn.d{color:#4f46e5}
h{font:600 14px Inter;display:block;margin-bottom:2px}
p{font:400 13px/1.45 Inter;color:#475569;margin:0}
.t-off p{color:#cbd5e1}
</style></head><body>
<div class="g">
<div class="toast t-def"><svg class="icn d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg><div><h>Saved to draft</h><p>Changes will publish on next deploy.</p></div></div>
<div class="toast t-suc"><svg class="icn s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg><div><h style="color:#039855">Workspace created</h><p>'Onboarding &amp; Compliance' is ready.</p></div></div>
<div class="toast t-err"><svg class="icn e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg><div><h style="color:#D92D20">Could not create workspace</h><p>Please try again.</p></div></div>
<div class="toast t-off"><svg class="icn" style="color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l18 18M8 8a5 5 0 0 1 8 0M5 12a9 9 0 0 1 3-3M12 20h.01"/></svg><div><h style="color:#fff">You are offline</h><p>We'll reconnect automatically.</p></div></div>
</div>
</body></html>
