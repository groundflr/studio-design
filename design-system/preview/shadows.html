<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:28px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.sh{width:110px;height:80px;background:#fff;border-radius:12px}
.lab{font:600 11px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:#475569}
.val{font:500 10px/1.3 ui-monospace,Menlo,monospace;color:#94a3b8;text-align:center}
</style></head><body>
<div class="g">
  <div class="col"><div class="sh" style="box-shadow:0 1px 2px 0 rgb(0 0 0/.05)"></div><div class="lab">xs</div><div class="val">0 1px 2px rgba(0,0,0,.05)</div></div>
  <div class="col"><div class="sh" style="box-shadow:0 1px 3px 0 rgb(0 0 0/.1),0 1px 2px -1px rgb(0 0 0/.1)"></div><div class="lab">sm</div><div class="val">Buttons · small cards</div></div>
  <div class="col"><div class="sh" style="box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1)"></div><div class="lab">md</div><div class="val">Workspace list panel</div></div>
  <div class="col"><div class="sh" style="box-shadow:0 0 0 3px rgb(99 102 241/.3);border:1px solid #cbd5e1"></div><div class="lab">Focus ring</div><div class="val">primary-400 / 30%</div></div>
</div>
</body></html>
