<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { box-sizing: border-box; padding: 20px; font-family: var(--font-sans); color: var(--fg-1); }
  *, *::before, *::after { box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; align-items: stretch; width: 88px; }
  .swatch .chip { height: 56px; border-radius: 8px; border: 1px solid rgb(0 0 0 / 0.06); }
  .swatch .name { font: 600 11px/1 var(--font-sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--surface-600); }
  .swatch .hex  { font: 500 11px/1 var(--font-mono); color: var(--surface-500); }
  .label { font: 600 11px var(--font-sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--surface-600); margin: 0 0 10px; }
</style>
</head><body>
<!-- overridden per card -->
</body></html>
