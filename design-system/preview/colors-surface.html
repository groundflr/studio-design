<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:20px;font-family:var(--font-sans);color:var(--fg-1)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:60px}
.chip{height:56px;border-radius:8px;border:1px solid rgb(0 0 0/.06)}
.name{font:600 10px/1 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--surface-600);margin-top:6px}
.hex{font:500 10px/1 ui-monospace,Menlo,monospace;color:var(--surface-500);margin-top:3px}
</style></head><body>
<div class="row" id="r"></div>
<script>
const stops=['0','50','100','200','300','400','500','600','700','800','900'];
const vals=['#ffffff','#f8fafc','#f1f5f9','#e2e8f0','#cbd5e1','#94a3b8','#64748b','#475569','#334155','#1e293b','#0f172a'];
const r=document.getElementById('r');
stops.forEach((s,i)=>{r.insertAdjacentHTML('beforeend',`<div class="swatch"><div class="chip" style="background:${vals[i]}"></div><div class="name">${s}</div><div class="hex">${vals[i]}</div></div>`)});
</script></body></html>
