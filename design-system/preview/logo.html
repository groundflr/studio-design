<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.wrap{display:grid;grid-template-columns:112px 1fr;gap:20px 18px;align-items:center}
.lab{font:600 11px Inter;letter-spacing:.04em;text-transform:uppercase;color:#64748b}
img.logo{max-height:42px;display:block}
img.sq{width:56px;height:56px;border-radius:12px}
img.ic{width:32px;height:32px}
.on-dark{background:#0f172a;padding:8px 14px;border-radius:8px;display:inline-flex}
</style></head><body>
<div class="wrap">
  <div class="lab">Wordmark</div><img class="logo" src="../assets/logos/studio_full_light.png"/>
  <div class="lab">Square mark</div><img class="sq" src="../assets/logos/studio_square_light.png"/>
  <div class="lab">On dark</div><div class="on-dark"><img class="logo" src="../assets/logos/studio_full_light.png" style="filter:invert(1) brightness(1.2)"/></div>
  <div class="lab">Sim glyphs</div>
  <div style="display:flex;gap:18px;align-items:center">
    <img class="ic" src="../assets/sim-icons/chat.png"/>
    <img class="ic" src="../assets/sim-icons/email.png"/>
    <img class="ic" src="../assets/sim-icons/call.png"/>
    <img class="ic" src="../assets/sim-icons/ai-conversation.png"/>
  </div>
</div>
</body></html>
