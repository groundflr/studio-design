<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:20px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid var(--surface-200);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center}
.dot{width:40px;height:40px;border-radius:10px;flex-shrink:0}
.lab{font:600 11px/1 var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--surface-700)}
.hex{font:500 11px/1 ui-monospace,Menlo,monospace;color:var(--surface-500);margin-top:4px}
.s{margin-top:4px;font:500 12px/1.3 var(--font-sans);color:var(--surface-500)}
</style></head><body>
<div class="g">
  <div class="card"><div class="dot" style="background:#039855"></div><div><div class="lab" style="color:#039855">Success</div><div class="hex">#039855</div><div class="s">Confirmations, saves</div></div></div>
  <div class="card"><div class="dot" style="background:#D92D20"></div><div><div class="lab" style="color:#D92D20">Error</div><div class="hex">#D92D20</div><div class="s">Destructive, errors</div></div></div>
  <div class="card"><div class="dot" style="background:#cc8925"></div><div><div class="lab" style="color:#cc8925">Warn</div><div class="hex">#cc8925</div><div class="s">Caution states</div></div></div>
  <div class="card"><div class="dot" style="background:#0284c7"></div><div><div class="lab" style="color:#0284c7">Info</div><div class="hex">#0284c7</div><div class="s">Neutral notices</div></div></div>
  <div class="card"><div class="dot" style="background:#4f46e5"></div><div><div class="lab" style="color:#4f46e5">Primary</div><div class="hex">#4f46e5</div><div class="s">Brand accent</div></div></div>
  <div class="card"><div class="dot" style="background:#374151"></div><div><div class="lab" style="color:#374151">Grey</div><div class="hex">#374151</div><div class="s">Default tag</div></div></div>
</div>
</body></html>
