<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.453.0/font/lucide.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all 200ms}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;font:500 14px/1 Inter;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.primary{background:#4f46e5;border-color:#6366f1;color:#fff}
.primary:hover{background:#4338ca;border-color:#4338ca}
.outline{background:#fff;border-color:#cbd5e1;color:#334155}
.outline:hover{background:#f8fafc;border-color:#94a3b8}
.destructive{background:#D92D20;border-color:#D92D20;color:#fff}
.ghost{background:transparent;border-color:transparent;color:#334155;box-shadow:none}
.ghost:hover{background:rgb(51 65 85 /.05)}
.ghost-primary{background:transparent;border-color:transparent;color:#4338ca;box-shadow:none}
.ghost-primary:hover{background:rgb(67 56 202 /.05)}
.hk{display:inline-flex;font:600 8px/1 Inter;padding:2px 3px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
.hk.d{border-color:rgb(51 65 85 /.25);background:rgb(51 65 85 /.1);color:rgb(51 65 85 /.7)}
</style></head><body>
<div class="g">
  <button class="btn primary">Save changes</button>
  <button class="btn primary"><i class="icon-plus"></i>New</button>
  <button class="btn primary">Publish <span class="hk">⌘↵</span></button>
  <button class="btn outline">Cancel</button>
  <button class="btn outline">Edit</button>
  <button class="btn destructive">Delete</button>
  <button class="btn ghost">Dismiss</button>
  <button class="btn ghost-primary">Open</button>
  <button class="btn primary" disabled style="opacity:.6">Disabled</button>
</div>
</body></html>
