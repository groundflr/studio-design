<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;font-weight:500;border:1px solid #cbd5e1;background:#fff;color:#334155;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);font-family:Inter}
.xs{height:24px;padding:0 8px;font-size:12px}
.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.md{height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.ib{width:36px;height:36px;padding:0;border-radius:9999px;border:0;background:transparent;color:#1e293b;box-shadow:none;cursor:pointer}
.ib:hover{background:rgb(30 41 59 /.05)}
.lab{font:500 10px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:#64748b;margin-top:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px}
svg{width:16px;height:16px}
</style></head><body>
<div class="g">
  <div class="col"><button class="btn xs">Label</button><div class="lab">xs · 24</div></div>
  <div class="col"><button class="btn sm">Label</button><div class="lab">sm · 28</div></div>
  <div class="col"><button class="btn md">Label</button><div class="lab">md · 36</div></div>
  <div class="col"><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg></button><div class="lab">icon md</div></div>
  <div class="col"><button class="ib" style="width:28px;height:28px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><div class="lab">icon sm</div></div>
  <div class="col"><button class="ib" style="width:40px;height:40px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12M6 12h12M6 18h12"/></svg></button><div class="lab">icon lg</div></div>
</div>
</body></html>
