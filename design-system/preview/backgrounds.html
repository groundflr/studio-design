<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bg{border-radius:12px;height:140px;background-size:cover;background-position:center;border:1px solid #e2e8f0;position:relative;overflow:hidden}
.lab{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:3px 8px;font:500 11px/1 Inter;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(6px)}
.dots{background-image:radial-gradient(circle,#cbd5e1 1px,#f8fafc 1px);background-size:16px 16px;background-repeat:repeat}
</style></head><body>
<div class="g">
  <div class="bg" style="background-image:url(../assets/backgrounds/mountain.png)"><span class="lab">Mountain</span></div>
  <div class="bg" style="background-image:url(../assets/backgrounds/rays.png)"><span class="lab">Rays</span></div>
  <div class="bg" style="background-image:url(../assets/backgrounds/waves.png)"><span class="lab">Waves</span></div>
  <div class="bg dots"><span class="lab" style="background:rgba(15,23,42,.55)">Dotted — auth shells</span></div>
</div>
</body></html>
