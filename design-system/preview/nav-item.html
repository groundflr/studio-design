<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.nav{width:240px;background:#f1f5f9;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font:600 11px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:#475569;padding:6px 8px}
.item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:6px 2px;border-radius:8px;font:500 14px Inter;color:#334155;cursor:pointer;transition:all 300ms}
.item:hover{background:#e0e7ff;color:#4338ca}
.item.active{background:#818cf8;color:#fff;font-weight:500}
.item.active svg{color:#fff}
.ic{display:flex;justify-content:center}
.ic svg{width:16px;height:16px;color:#64748b}
.arrow{width:22px;height:22px;border-radius:8px;background:#c7d2fe;display:none;align-items:center;justify-content:center}
.item:hover .arrow{display:flex}
.arrow svg{width:10px;height:10px;color:#4338ca}
.badge{background:#f1f5f9;color:#cbd5e1;padding:2px 4px;border-radius:4px;font:600 10px/1 Inter;letter-spacing:.05em;margin-right:8px}
</style></head><body>
<div class="nav">
  <div class="eyebrow">Summary</div>
  <div class="item active"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></div><span>Dashboard</span><span></span></div>
  <div class="item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg></div><span>Simulations</span><div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
  <div class="item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3v4l-5 9a3 3 0 0 0 3 4h10a3 3 0 0 0 3-4l-5-9V3M9 3h6"/></svg></div><span>Assessments</span></div>
  <div class="item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/></svg></div><span>Rubrics</span><span class="badge">COMING</span></div>
</div>
</body></html>
