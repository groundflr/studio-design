<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.card{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card img{width:48px;height:48px}
.name{font:600 12px Inter;color:#1e293b}
.desc{font:400 11px/1.3 Inter;color:#64748b;text-align:center}
</style></head><body>
<div class="g">
  <div class="card"><img src="../assets/sim-icons/chat.png"/><div class="name">Chat</div><div class="desc">Slack / Teams / iMessage</div></div>
  <div class="card"><img src="../assets/sim-icons/email.png"/><div class="name">Email</div><div class="desc">Receive · reply · compose</div></div>
  <div class="card"><img src="../assets/sim-icons/call.png"/><div class="name">Voice call</div><div class="desc">ElevenLabs driven</div></div>
  <div class="card"><img src="../assets/sim-icons/ai-conversation.png"/><div class="name">AI conversation</div><div class="desc">Scripted dialogue</div></div>
</div>
</body></html>
