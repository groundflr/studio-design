<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
html,body{margin:0;padding:0;background:#fff}
body{padding:22px;font-family:var(--font-sans)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.card.hero{box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);border:0}
.title{font:600 18px/1.3 Inter;color:#1e293b}
.meta{font:500 14px/1.4 Inter;color:#64748b;margin-top:4px}
.row{display:flex;gap:12px;align-items:center}
.thumb{width:44px;height:44px;border-radius:10px;background:#4f46e5;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px Inter}
</style></head><body>
<div class="g">
  <div class="card"><div class="row"><div class="thumb">OC</div><div><div class="title">Onboarding &amp; Compliance</div><div class="meta">12 members</div></div></div></div>
  <div class="card hero"><div class="row"><div class="thumb" style="background:#db2777">DS</div><div><div class="title">Design Studio</div><div class="meta">4 members · shadow-md</div></div></div></div>
  <div class="card" style="grid-column:1/-1"><div class="title" style="font-size:14px">Customer call · Upset subscriber</div><div class="meta">Chat · Published · 3 scenes</div></div>
</div>
</body></html>
